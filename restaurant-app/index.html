<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBites - 今の気分でお店探し</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>MoodBites</h1>
            <p>今の気分にぴったりなお店を見つけよう</p>
        </header>

        <section class="mood-selector">
            <h2>何が食べたい気分？</h2>
            <div class="mood-buttons" id="mood-buttons">
                <!-- Buttons will be generated by JS -->
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="例: ラーメン、カフェ、焼肉...">
            </div>
        </section>

        <section class="results-section">
            <h2 id="results-title">おすすめのお店</h2>
            <div class="restaurant-grid" id="restaurant-grid">
                <!-- Cards will be generated by JS -->
            </div>
            <div id="no-results" class="hidden">
                <p>見つかりませんでした。別のキーワードを試してみてください。</p>
            </div>
        </section>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
